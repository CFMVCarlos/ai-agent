[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiagent"
version = "0.1.0"
description = "AI agent CLI tool with function-calling capabilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "gitlint>=0.19.1",
    "pydoclint>=0.6.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "ty>=0.0.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiagent"]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "FIX",
    "TD",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001"]

[tool.pydoclint]
exclude = ".git|.tox|.venv|build|dist|.uv-cache|.ruff_cache"
skip-checking-short-docstrings = false
check-style-mismatch = true
check-arg-defaults = true
show-filenames-in-every-violation-message = true
check-class-attributes = false

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
