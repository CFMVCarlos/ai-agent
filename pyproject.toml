[project]
name = "aiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pydoclint>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.pydoclint]
style = "numpy"
exclude = '\.venv|\.agents|__pycache__'

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = [".venv", ".agents"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]

